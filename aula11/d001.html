<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>
    <h1>Nacionalidade</h1>
    <label for="txtpais">Vivendo em: </label> <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Continuar" onclick="continuar()">
    <div id="res"></div>

    <script>
        function continuar() {
            var pais = window.document.getElementById('txtpais').value;
            var res = window.document.getElementById('res');

            if (pais == 'Brasil') {
                    res.innerHTML = '<p>Você é <strong>Brasileiro</strong>!</p>'
                } else {
                    res.innerHTML = '<p>Você é <strong>Estrangeiro</strong>!</p>'
                }
        }
    </script>
</body>
</html>
