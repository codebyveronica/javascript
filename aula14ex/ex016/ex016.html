<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div>
            <p><label for="iniciotxt">Início: </label> <input type="number" name="iniciotxt" id="iniciotxt"></p>

            <p><label for="fimtxt">Fim: </label> <input type="number" name="fimtxt" id="fimtxt"></p>

            <p><label for="passotxt">Passo: </label><input type="number" name="passotxt" id="passotxt"></p>

            <p><input type="button" value="Contar" onclick="contar()"></p>
        </div>
        <div id="res">
            <p>Preparando a contagem...</p>
        </div>
    </section>
    <footer>
        <p>&copy; Curso em vídeo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
